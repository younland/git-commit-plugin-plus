name: Publish to Open VSX

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    # 若在 Trusted Publishers 页面注册时指定了 environment，取消下一行注释
    # environment: publish
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing 必需
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: npm

      - run: npm ci

      - run: npm run compile

      - name: Publish to Open VSX (trusted publishing)
        run: npx ovsx publish --trusted-publishing
